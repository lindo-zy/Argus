# Argus 部署编排：db + backend + frontend（nginx 同源反代）。
# 项目名固定为 argus：无论 compose 文件在哪个目录执行，容器名与数据卷 argus_pgdata 都保持一致。
name: argus

services:
  db:
    image: postgres:17-alpine
    container_name: argus-db
    environment:
      POSTGRES_DB: argus
      POSTGRES_USER: argus
      POSTGRES_PASSWORD: argus
      PGDATA: /var/lib/postgresql/data/pgdata
    # 只绑定本机回环：宿主机本地开发连 127.0.0.1:5433，不向公网暴露 PostgreSQL。
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - argus_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U argus -d argus"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ../backend
      dockerfile: ../deploy/backend.Dockerfile
    container_name: argus-backend
    environment:
      ARGUS_DATABASE_URL: postgresql+psycopg://argus:argus@db:5432/argus
      ARGUS_JENKINS_URL: ${ARGUS_JENKINS_URL:-}
      ARGUS_JENKINS_KIND: ${ARGUS_JENKINS_KIND:-jenkins}
      ARGUS_JENKINS_INSTALL_JOB: ${ARGUS_JENKINS_INSTALL_JOB:-argus-install}
      ARGUS_JENKINS_CASES_JOB: ${ARGUS_JENKINS_CASES_JOB:-argus-cases}
      ARGUS_JENKINS_USERNAME: ${ARGUS_JENKINS_USERNAME:-}
      ARGUS_JENKINS_TOKEN: ${ARGUS_JENKINS_TOKEN:-}
      ARGUS_JENKINS_WORKER: ${ARGUS_JENKINS_WORKER:-1}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
      dockerfile: ../deploy/frontend.Dockerfile
    container_name: argus-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  argus_pgdata:
